<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tabulator-tables/dist/css/tabulator_midnight.min.css">
<title>Nexus 백테스트</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #131722; color: #d1d4dc; height: 100vh; display: flex; flex-direction: column; }
  header, .run { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1c2330; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; }
  .title { color: #d1d4dc; font-weight: 700; }
  .mode-tabs { display: inline-flex; flex: none; border: 1px solid #434651; border-radius: 6px; overflow: hidden; background: #12161f; }
  .mode-tabs a { color: #8a919c; text-decoration: none; padding: 4px 12px; font-size: 13px; line-height: 1.4; }
  .mode-tabs a + a { border-left: 1px solid #434651; }
  .mode-tabs a:hover { color: #d1d4dc; background: #1c2330; }
  .mode-tabs a[aria-current="page"] { background: #14282c; color: #26a69a; font-weight: 700; }
  button, input, select { background: #12161f; color: #d1d4dc; border: 1px solid #3a4458; border-radius: 4px; padding: 4px 8px; }
  button.go { background: #d4ff4a; color: #111; font-weight: 700; border: 0; }
  #grid { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .row { display: flex; flex: 1 1 0; min-height: 0; }
  .frame { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid #2a2e39; border-bottom: 1px solid #2a2e39; }
  .frame.sel { outline: 1px solid #d4ff4a; }
  .frame-bar { display: flex; gap: 6px; align-items: center; padding: 4px 6px; background: #18202c; flex: none; }
  .panes { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .pane { flex: 1 1 0; min-height: 0; display: flex; border-top: 1px solid #2a2e39; }
  .frame-bar button.panel-toggle.on { border-color: #26a69a; color: #26a69a; }
  .ind-panel { flex: none; width: 300px; min-height: 0; overflow-y: auto; background: #161b26; border-right: 1px solid #2a2e39; padding: 6px 8px; box-sizing: border-box; font-size: 12px; }
  .ind-panel[hidden] { display: none; }
  .ind-panel .ind-hint { color: #7d8590; font-size: 11px; line-height: 1.5; }
  .ind-chart-tools { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid #2a2e39; }
  .ind-chart-tools .bar-style { display: flex; flex-direction: column; gap: 2px; color: #8a919c; font-size: 11px; }
  .ind-chart-tools select { width: 100%; padding: 2px 4px; font-size: 12px; }
  .ind-panel .ind-cat-head { cursor: pointer; color: #8a919c; font-weight: 700; padding: 3px 0; user-select: none; }
  .ind-panel .ind-cat.locked .ind-cat-body { opacity: 0.55; }
  .ind-panel .ind-row.locked, .ind-panel .ind-row.locked label { cursor: default; }
  .ind-panel .ind-cat-head:hover { color: #d1d4dc; }
  .ind-panel .ind-cat-body { padding-left: 12px; }
  .ind-panel .ind-row { display: flex; align-items: flex-start; padding: 2px 0; cursor: pointer; }
  .ind-panel .ind-row label { display: flex; flex: 1; min-width: 0; align-items: flex-start; cursor: pointer; }
  .ind-panel .src-name { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.35; }
  .ind-panel .src-gear { flex: none; width: 18px; height: 18px; margin: 1px 0 0 4px; padding: 0; border: none; background: transparent; color: #8a919c; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .ind-panel .src-gear:hover { color: #d1d4dc; }
  .ind-panel .src-gear:disabled { opacity: 0.35; cursor: default; }
  .ind-panel .src-plain { color: #6e7684; cursor: default; padding-left: 18px; }
  .ind-panel .ind-row.layer { color: #8a919c; font-size: 11px; }
  .ind-panel .ind-layers { padding-left: 20px; }
  .ind-panel input[type="checkbox"] { background: none; border: none; padding: 0; margin: 0 5px 0 0; accent-color: #26a69a; }
  .sysvar-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .sysvar-box { width: 440px; max-width: calc(100vw - 24px); max-height: 80vh; overflow: auto; background: #1c2330; color: #d1d4dc; border: 1px solid #434651; border-radius: 6px; padding: 12px 14px; box-sizing: border-box; }
  .sysvar-title { font-weight: 700; }
  .sysvar-note { color: #8a919c; font-size: 12px; margin: 4px 0 10px; }
  .sysvar-head, .sysvar-line { display: grid; grid-template-columns: 1fr 150px; gap: 8px; align-items: center; }
  .sysvar-head { color: #8a919c; font-size: 12px; padding-bottom: 4px; border-bottom: 1px solid #2a2e39; }
  .sysvar-line { padding: 3px 0; }
  .sysvar-line input, .sysvar-line select { width: 100%; box-sizing: border-box; }
  .sysvar-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .chart { flex: 1 1 0; min-width: 0; min-height: 0; }
  #trades-resize { flex: none; height: 22px; cursor: ns-resize; user-select: none; text-align: center; color: #8a919c; background: #1c2330; border-top: 1px solid #2a2e39; line-height: 22px; font-size: 12px; }
  #trades-resize:hover { color: #d4ff4a; }
  #trades { flex: none; height: 180px; overflow: hidden; background: #131722; display: flex; flex-direction: column; }
  #trades-grid { flex: 1 1 0; min-height: 0; }
  #trades .tabulator { background: #131722; border: none; font-size: 13px; }
  #trades .tabulator .tabulator-tableholder { overflow-x: hidden; }
  #trades .tabulator-header, #trades .tabulator-header .tabulator-col { background: #131722; color: #8a919c; border-color: #2a2e39; }
  #trades .tabulator-tableholder .tabulator-table { background: #131722; color: #d1d4dc; }
  #trades .tabulator-row { background: #131722; color: #d1d4dc; }
  #trades .tabulator-row.tabulator-row-even { background: #161b26; }
  #trades .tabulator-row .tabulator-cell { border-color: #1c2330; }
  #trades .tabulator-placeholder-contents { font-size: 13px; font-weight: 400; color: #8a919c; }
  .pos { color: #d4ff4a; }
  #msg { color: #ffb020; }
  .pair { display: none; gap: 8px; align-items: center; }
  body.pair .pair { display: inline-flex; }
</style>
</head>
<body>
<header>
  <span class="title">Nexus</span>
  <nav class="mode-tabs" aria-label="화면">
    <a href="/">실시간</a>
    <a href="/backtest.html" aria-current="page">백테스트</a>
  </nav>
  <button id="screen-new" type="button">새화면</button>
  <button id="row-add" type="button">행추가</button>
  <button id="col-add" type="button">열추가</button>
</header>
<div class="run">
  <label>시작일 <input id="start" type="date"></label>
  <label>종료일 <input id="end" type="date"></label>
  <span class="pair">기준 <input id="base" value="" placeholder="SPXW:20261009:7800:call"></span>
  <span class="pair">상대 <input id="opp" value="" placeholder="SPXW:20261009:7800:put"></span>
  <span class="pair">선물 <input id="fut" value="ESZ26"></span>
  <label>수량 <input id="qty" type="number" min="1" value="1" style="width:4em"></label>
  <button class="go" id="run" type="button">실행</button>
  <span id="msg"></span>
</div>
<div id="grid"></div>
<div id="trades-resize" title="드래그로 크기 조절">⠿ 거래내역</div>
<div id="trades"><div id="trades-grid"></div></div>
<script src="lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script src="tabulator-tables/dist/js/tabulator.min.js"></script>
<script src="mirae-layers.js"></script>
<script src="sma-layers.js"></script>
<script src="horiz-lines.js?v=adjslope"></script>
<script src="fx-layers.js"></script>
<script src="fx3-layers.js"></script>
<script src="pgap-layers.js"></script>
<script src="os-layers.js?v=wr4"></script>
<script src="cu-layers.js?v=rails"></script>
<script src="snco-layers.js?v=circles"></script>
<script src="ymae-layers.js"></script>
<script src="sniper-layers.js"></script>
<script src="pvc-layers.js"></script>
<script src="data2-layers.js"></script>
<script src="wplot-layers.js"></script>
<script src="weekly-legs.js"></script>
<script src="pair-markers.js"></script>
<script src="feed.js"></script>
<script src="indicator-tree.js"></script>
<script src="yl-tree.js?v=wr2"></script>
<script src="backtest-sidebar.js?v=wr2"></script>
<script src="chart-v4.js?v=1"></script>
<script src="backtest.js?v=paintbar1"></script>
</body>
</html>
