<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C Trading Engine 대시보드</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #131722; color: #d1d4dc; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #1c2330; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; }
  header .title { font-weight: 700; }
  .badge { padding: 2px 8px; border-radius: 4px; background: #2a2e39; font-size: 12px; }
  .badge.ok { background: #1e4d3b; }
  .badge.err { background: #5d2a2a; }
  #score { font-size: 18px; font-weight: 700; min-width: 3ch; text-align: center; }
  #mirae-badges { display: inline-flex; gap: 12px; align-items: baseline; }
  #mirae-badges[hidden] { display: none; }
  #panes { width: 100vw; height: calc(100vh - 110px); display: flex; flex-direction: column; overflow: hidden; }
  #panes .pane { width: 100%; position: relative; flex: none; border-bottom: 1px solid #2a2e39; box-sizing: border-box; }
  .pane .tools { position: absolute; top: 6px; left: 8px; right: 8px; z-index: 3; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; background: rgba(19,23,34,.8); border-radius: 6px; padding: 3px 6px; width: fit-content; max-width: calc(100% - 16px); }
  .chip { border: 1.5px solid #434651; background: #1c2330; color: #8a919c; border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .chip.on { border-color: #26a69a; color: #26a69a; background: #14282c; font-weight: 700; }
  .chip:hover { border-color: #26a69a; }
  .chip.layer { padding: 1px 8px; font-size: 11px; }
  .chip.del { color: #ef5350; }
  .resizebar { position: absolute; bottom: -3px; left: 0; right: 0; height: 6px; z-index: 4; cursor: ns-resize; text-align: center; color: #434651; font-size: 9px; line-height: 6px; user-select: none; }
  .resizebar:hover { color: #26a69a; }
  input, button { background: #2a2e39; color: #d1d4dc; border: 1px solid #434651; border-radius: 4px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { background: #363c4a; }
  .pane .tools .chip { background: #1c2330; }
  .pane .tools .chip.on { background: #14282c; }
  .pane .tools .chip:hover { background: #2a2e39; }
  #ws-state { margin-left: auto; }
  #hint { font-size: 12px; color: #7d8590; }
  .sym-picker { position: relative; }
  #symbol-results { position: absolute; top: calc(100% + 2px); left: 0; z-index: 10; background: #1c2330; border: 1px solid #434651; border-radius: 4px; max-height: 280px; overflow-y: auto; min-width: 300px; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  #symbol-results .row { padding: 4px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  #symbol-results .row:hover, #symbol-results .row.active { background: #363c4a; }
  #symbol-results .row .code { color: #7d8590; min-width: 9ch; font-family: monospace; }
  #symbol-results .row .mkt { margin-left: auto; color: #b08c3d; font-size: 11px; }
  #symbol-results .empty { padding: 6px 10px; color: #7d8590; }
  #symbol-name { font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="title">미래곡선 대시보드</span>
  <span class="badge" id="mode">replay</span>
  <span id="mirae-badges" hidden>
    <span>점수 <span id="score">–</span></span>
    <span class="badge" id="reg">회귀: –</span>
    <span class="badge" id="pred">예측: –</span>
    <span class="badge" id="final">상태: –</span>
    <span class="badge" id="ob">호가: –</span>
  </span>
  <button id="pane-add" title="차트 칸을 추가한다">+ 차트</button>
  <span class="sym-picker">종목 <input id="symbol" value="005930" size="14" placeholder="코드 또는 종목명" autocomplete="off"><button id="symbol-apply">전환</button><span id="symbol-name" class="badge"></span><div id="symbol-results" hidden></div></span>
  <span id="ws-state" class="badge err">연결 끊김</span>
  <span id="hint">화면틀:</span>
  <input id="ws-name" value="default" size="10">
  <button id="ws-save">저장</button>
  <button id="ws-load">불러오기</button>
  <span id="hint">※ 예측선은 미래 가격이 아니라 생성 시점의 계산 결과입니다</span>
</header>
<div id="panes"></div>
<script src="lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script src="mirae-layers.js"></script>
<script src="sma-layers.js"></script>
<script src="workspace.js"></script>
<script src="pane-sync.js"></script>
<script src="app.js"></script>
</body>
</html>
