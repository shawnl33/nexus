<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,"> <!-- 파비콘 없음: 브라우저 자동 요청의 404 로그를 끈다 -->
<title>Nexus Trading Engine 대시보드</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #131722; color: #d1d4dc; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #1c2330; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; }
  .layout-tools { display: inline-flex; gap: 12px; align-items: center; flex: none; }
  header .title { font-weight: 700; }
  .badge { padding: 2px 8px; border-radius: 4px; background: #2a2e39; font-size: 12px; }
  .badge.ok { background: #1e4d3b; }
  .badge.err { background: #5d2a2a; }
  .badge.load { background: #3a3f1e; }
  #score { font-size: 18px; font-weight: 700; min-width: 3ch; text-align: center; }
  #mirae-badges { display: inline-flex; gap: 12px; align-items: baseline; }
  #mirae-badges[hidden] { display: none; }
  #panes { position: relative; width: 100vw; height: calc(100vh - 110px); display: flex; flex-direction: column; overflow: hidden; }
  .pane-row { display: flex; flex-direction: row; width: 100%; min-height: 0; flex: none; position: relative; }
  .frame { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: none; height: 100%; box-sizing: border-box; border-right: 1px solid #2a2e39; border-bottom: 1px solid #2a2e39; }
  .frame-tools { position: relative; z-index: 6; flex: none; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 3px 6px; background: #18202c; border-bottom: 1px solid #2a2e39; }
  .frame-tools button { white-space: nowrap; flex: none; }
  .frame-tools button.panel-toggle.on { border-color: #26a69a; color: #26a69a; }
  .frame-tools .frame-close { margin-left: auto; }
  .frame-tools .sym-picker { min-width: 0; }
  .frame-body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
  #panes .pane { width: 100%; position: relative; flex: none; display: flex; flex-direction: column; border-bottom: 1px solid #2a2e39; box-sizing: border-box; }
  /* 칸 삭제(×)만 차트 모서리에 겹친다. ☰는 화면틀의 +차트 옆이라 세로 줄을 만들지 않는다. */
  .pane .tools { position: absolute; top: 2px; right: 4px; z-index: 3; display: flex; padding: 0; background: transparent; border: none; }
  .pane .tools .chip.del { margin-left: 0; }
  /* 도구줄 아래 칸 본문: [지표 패널 | 차트] 수평 분할 */
  .pane .pane-body { flex: 1 1 0; min-height: 0; display: flex; }
  .pane .chart-host { flex: 1 1 0; min-width: 0; position: relative; }
  body.charts-locked .chart-host { pointer-events: none; }
  #load-veil { display: none; position: fixed; inset: 0; z-index: 50; align-items: center; justify-content: center; background: rgba(10, 12, 18, 0.62); cursor: wait; }
  body.charts-locked #load-veil { display: flex; }
  .load-card { text-align: center; }
  #load-pct { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; color: #d1d4dc; }
  .load-caption { margin-top: 4px; color: #8a919c; font-size: 13px; }
  #load-cancel { margin-top: 14px; }
  /* 칸별 지표 패널 (트리) — ☰로 접으면 숨기고(hidden) 차트가 칸 전체 폭을 쓴다 */
  .ind-panel { flex: none; width: 300px; overflow-y: auto; background: #161b26; border-right: 1px solid #2a2e39; padding: 6px 8px; box-sizing: border-box; font-size: 12px; }
  .ind-panel[hidden] { display: none; }
  .ind-panel .ind-hint { color: #7d8590; font-size: 11px; line-height: 1.5; }
  .ind-chart-tools { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid #2a2e39; }
  .ind-chart-tools .chip { text-align: left; }
  .ind-chart-tools .bar-styles { display: flex; flex-direction: column; gap: 6px; }
  .ind-chart-tools .bar-style { display: flex; flex-direction: column; gap: 2px; color: #8a919c; font-size: 11px; }
  .ind-chart-tools select { width: 100%; padding: 2px 4px; font-size: 12px; }
  .link-legs { display: flex; flex-direction: column; gap: 3px; padding: 2px 0 4px 18px; }
  .link-leg { display: flex; flex-direction: column; gap: 1px; color: #8a919c; font-size: 11px; }
  .link-leg select { width: 100%; padding: 1px 2px; font-size: 11px; }
  .ind-panel .ind-cat-head { cursor: pointer; color: #8a919c; font-weight: 700; padding: 3px 0; user-select: none; }
  .ind-panel .ind-cat-head:hover { color: #d1d4dc; }
  .ind-panel .ind-cat-body { padding-left: 12px; }
  .ind-panel .ind-row { display: flex; align-items: flex-start; padding: 2px 0; cursor: pointer; }
  .ind-panel .ind-row label { display: flex; flex: 1; min-width: 0; align-items: flex-start; cursor: pointer; }
  .ind-panel .src-name { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.35; }
  .ind-panel .src-gear { flex: none; width: 18px; height: 18px; margin: 1px 0 0 4px; padding: 0; border: none; background: transparent; color: #8a919c; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .ind-panel .src-gear:hover { color: #d1d4dc; }
  .sysvar-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .sysvar-box { width: 440px; max-width: calc(100vw - 24px); max-height: 80vh; overflow: auto; background: #1c2330; color: #d1d4dc; border: 1px solid #434651; border-radius: 6px; padding: 12px 14px; box-sizing: border-box; }
  .sysvar-title { font-weight: 700; }
  .sysvar-note { color: #8a919c; font-size: 12px; margin: 4px 0 10px; }
  .sysvar-head, .sysvar-line { display: grid; grid-template-columns: 1fr 150px; gap: 8px; align-items: center; }
  .sysvar-head { color: #8a919c; font-size: 12px; padding-bottom: 4px; border-bottom: 1px solid #2a2e39; }
  .sysvar-line { padding: 3px 0; }
  .sysvar-line input { width: 100%; box-sizing: border-box; }
  .sysvar-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .ind-panel .src-plain { color: #6e7684; cursor: default; padding-left: 18px; }
  .ind-panel .ind-row.layer { color: #8a919c; font-size: 11px; }
  .ind-panel .ind-layers { padding-left: 20px; }
  .ind-panel input[type="checkbox"] { background: none; border: none; padding: 0; margin: 0 5px 0 0; accent-color: #26a69a; }
  .chip { border: 1.5px solid #434651; background: #1c2330; color: #8a919c; border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .chip.on { border-color: #26a69a; color: #26a69a; background: #14282c; font-weight: 700; }
  .chip:hover { border-color: #26a69a; }
  .chip.del { color: #ef5350; }
  .resizebar { position: absolute; bottom: -3px; left: 0; right: 0; height: 6px; z-index: 4; cursor: ns-resize; text-align: center; color: #434651; font-size: 9px; line-height: 6px; user-select: none; }
  .resizebar:hover { color: #26a69a; }
  /* height:auto — 기본 .resizebar의 height:6px가 top/bottom과 겹치면 세로가 6px로 고정된다. */
  .resizebar.col { position: absolute; top: 0; right: auto; bottom: 0; height: auto; width: 6px; margin-left: -3px; z-index: 5; cursor: ew-resize; }
  .resizebar.row { position: absolute; left: 0; right: 0; bottom: -3px; height: 6px; z-index: 5; cursor: ns-resize; }
  input, button { background: #2a2e39; color: #d1d4dc; border: 1px solid #434651; border-radius: 4px; padding: 4px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { background: #363c4a; }
  .pane .tools .chip { background: #1c2330; }
  .pane .tools .chip.on { background: #14282c; }
  .pane .tools .chip:hover { background: #2a2e39; }
  #broker-slot { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
  #broker-slot[hidden] { display: none; }
  #broker-slot[hidden] + #ws-state { margin-left: auto; }
  #broker-profile { padding: 2px 6px; }
  #broker-env.env-paper { background: #6b4e16; color: #f6e2b3; }
  #broker-env.env-live { background: #6b2430; color: #ffd5d8; }
  #hint, label.hint { font-size: 12px; color: #7d8590; }
  #bar-cap { width: 7ch; padding: 2px 6px; }
  .sym-picker { position: relative; display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .sym-picker input { padding: 1px 6px; font-size: 12px; width: 24ch; text-transform: uppercase; }
  .sym-chips { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
  .sym-chip { display: inline-flex; align-items: center; gap: 3px; border: 1px solid #434651; border-radius: 999px; padding: 0 6px; font-size: 11px; line-height: 18px; }
  .sym-chip-text { display: inline-flex; align-items: baseline; gap: 4px; min-width: 0; }
  .sym-chip-name { color: #8a919c; max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sym-chip-role { color: #26a69a; font-weight: 700; }
  button.sym-chip { background: transparent; padding: 0 6px; font-size: 11px; line-height: 18px; cursor: pointer; }
  button.sym-chip.main { border-color: #d1d4dc; }
  button.sym-chip.replacing { border-color: #26a69a; color: #26a69a; }
  .sym-chip .x { border: 0; background: transparent; color: #8a919c; padding: 0 2px; font-size: 12px; line-height: 16px; cursor: pointer; }
  .sym-chips select.overlay-scale { background: #1c2330; color: #d1d4dc; border: 1px solid #434651; border-radius: 999px; padding: 0 6px; font-size: 11px; line-height: 18px; height: 20px; cursor: pointer; }
  .sym-chip .x:hover { color: #ef5350; }
  .sym-results { position: absolute; top: calc(100% + 2px); left: 0; z-index: 10; background: #1c2330; border: 1px solid #434651; border-radius: 4px; max-height: 280px; overflow-y: auto; min-width: 300px; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  .sym-results .row { padding: 4px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .sym-results .row:hover, .sym-results .row.active { background: #363c4a; }
  .sym-results .row .code { color: #7d8590; min-width: 9ch; font-family: monospace; }
  .sym-results .row .mkt { margin-left: auto; color: #b08c3d; font-size: 11px; }
  .sym-results .empty { padding: 6px 10px; color: #7d8590; }
  .sym-browse-btn { padding: 1px 7px; line-height: 18px; }
  .sym-browse-btn svg { display: block; }
  .sym-browse { position: fixed; inset: 0; z-index: 60; background: rgba(10,12,18,0.62); display: flex; align-items: center; justify-content: center; }
  .sym-browse[hidden] { display: none; }
  .sym-browse-card { width: min(760px, calc(100vw - 32px)); max-height: min(78vh, 720px); display: flex; flex-direction: column; background: #1c2330; border: 1px solid #434651; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .sym-browse-head { display: flex; gap: 6px; align-items: center; padding: 10px 12px; border-bottom: 1px solid #2a2e39; }
  .sym-browse-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #f6e2b3; background: #6b4e16; border-radius: 4px; padding: 1px 6px; }
  .sym-tab { background: transparent; }
  .sym-tab.on { border-color: #26a69a; color: #26a69a; font-weight: 700; }
  .sym-browse-x { margin-left: auto; }
  .sym-browse-body { padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 8px; min-height: 240px; }
  .sym-browse-msg { margin: 8px 0; color: #8a919c; }
  .sym-browse-q, .sym-strike { width: 16ch; text-transform: none; }
  .sym-browse-list { display: flex; flex-direction: column; gap: 2px; }
  .sym-browse-row { display: flex; gap: 10px; text-align: left; background: transparent; }
  .sym-browse-row .code { color: #7d8590; min-width: 10ch; font-family: monospace; }
  .sym-card-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .sym-card { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 140px; text-align: left; background: #131722; }
  .sym-card small { color: #7d8590; font-family: monospace; }
  .sym-browse h3 { margin: 8px 0 0; font-size: 13px; font-weight: 700; color: #d1d4dc; }
  .opt-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sym-exp-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .sym-exp.on { border-color: #26a69a; color: #26a69a; }
  .opt-chain { display: flex; flex-direction: column; gap: 2px; }
  .opt-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
  .opt-row.atm { background: rgba(38, 166, 154, 0.2); border-radius: 4px; }
  .opt-k { text-align: center; font-variant-numeric: tabular-nums; min-width: 8ch; }
  .opt-row.atm .opt-k { color: #26a69a; font-weight: 700; }
  .atm-tag { margin-left: 4px; font-style: normal; font-size: 10px; letter-spacing: 0.04em; }
  .opt-side { text-align: left; background: #131722; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt-side.put { text-align: right; }
  .opt-side.empty { visibility: hidden; }
</style>
</head>
<body>
<div id="load-veil" aria-live="polite">
  <div class="load-card">
    <div id="load-pct">0%</div>
    <div class="load-caption">불러오는 중</div>
    <button type="button" id="load-cancel">취소</button>
  </div>
</div>
<header>
  <span class="title">Nexus Trading Engine 대시보드</span>
  <span class="badge" id="mode">–</span>
  <span id="mirae-badges" hidden>
    <span>점수 <span id="score">–</span></span>
    <span class="badge" id="reg">회귀: –</span>
    <span class="badge" id="pred">예측: –</span>
    <span class="badge" id="final">상태: –</span>
    <span class="badge" id="ob">호가: –</span>
  </span>
  <span class="layout-tools">
    <button id="screen-new" title="빈 차트 하나로 새 화면을 시작한다">새화면</button>
    <button id="row-add" title="맨 아래에 화면틀 행을 추가한다">행추가</button>
    <button id="col-add" title="맨 오른쪽에 화면틀 열을 추가한다">열추가</button>
  </span>
  <label class="hint" for="bar-cap">상한</label>
  <input id="bar-cap" type="number" min="16" max="8192" step="1" value="2560" title="차트가 다루는 1분봉 개수. 값을 바꾸면 과거 봉을 이 개수까지 다시 받습니다">
  <span id="broker-slot" hidden>
    <label class="hint" for="broker-profile">접속</label>
    <select id="broker-profile" title="증권사 실전·모의 접속. 바꾸면 시세와 잔고, 주문이 그 서버로 다시 연결됩니다"></select>
    <span id="broker-env" class="badge"></span>
  </span>
  <span id="ws-state" class="badge err">연결 끊김</span>
  <span id="hint">화면틀:</span>
  <input id="ws-name" value="default" size="10">
  <button id="ws-save">저장</button>
  <button id="ws-load">불러오기</button>
  <span id="hint">※ 예측선은 미래 가격이 아니라 생성 시점의 계산 결과입니다</span>
</header>
<div id="panes"></div>
<script src="lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script src="mirae-layers.js"></script>
<script src="sma-layers.js"></script>
<script src="horiz-lines.js?v=diamond"></script>
<script src="fx-layers.js"></script>
<script src="fx3-layers.js"></script>
<script src="pgap-layers.js"></script>
<script src="os-layers.js?v=gray"></script>
<script src="cu-layers.js?v=rails"></script>
<script src="snco-layers.js?v=circles"></script>
<script src="ymae-layers.js"></script>
<script src="sniper-layers.js"></script>
<script src="pvc-layers.js"></script>
<script src="data2-layers.js"></script>
<script src="wplot-layers.js"></script>
<script src="weekly-legs.js"></script>
<script src="pair-markers.js"></script>
<script src="feed.js"></script>
<script src="gaps.js"></script>
<script src="gap-shade.js?v=notrade"></script>
<script src="workspace.js"></script>
<script src="indicator-tree.js"></script>
<script src="yl-tree.js"></script>
<script src="pane-sync.js"></script>
<script src="watch-guard.js"></script>
<script src="symbol-pick.js"></script>
<script src="symbol-browse.js"></script>
<script src="symbol-browse-nh.js?v=cme"></script>
<script src="overlay-ratio.js"></script>
<script src="app.js?v=nhbrowse"></script>
</body>
</html>
